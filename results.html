<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Results | SIS</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><div class="brand">Student Information System</div><button class="menu-toggle" onclick="toggleSidebar()">☰</button><div class="top-user">Administrator</div></header>
<div class="layout"><aside class="sidebar" id="sidebar"><a href="dashboard.html">Dashboard</a><a href="students.html">Students</a><a href="departments.html">Departments</a><a href="courses.html">Courses</a><a class="active" href="results.html">Results</a><a href="index.html" onclick="logout()">Logout</a></aside>
<main class="content"><div class="page-head"><div><h1>Results</h1><p>Record and review student academic results.</p></div></div>
<section class="panel"><h2>Record Result</h2><form id="resultForm" class="form-grid"><select name="student" id="resultStudent" required></select><select name="course" id="resultCourse" required></select><input name="session" placeholder="2025/2026" required><select name="semester"><option>First</option><option>Second</option></select><input name="score" type="number" min="0" max="100" step=".01" placeholder="Score" required><button class="btn primary" type="submit">Save Result</button></form></section>
<section class="panel"><h2>Result Records</h2><div class="table-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Session</th><th>Semester</th><th>Score</th><th>Grade</th><th>Action</th></tr></thead><tbody id="resultTable"></tbody></table></div></section>
</main></div><script src="js/app.js"></script></body></html>
